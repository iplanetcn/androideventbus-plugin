name: Build IDEA Plugin and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*'  # Trigger on version tags (e.g., v1.0)

permissions:
  contents: write  # Required to create releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Cache Gradle dependencies
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Grant execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build the plugin
      - name: Build plugin
        run: ./gradlew buildPlugin

      # Create release and upload artifact (only for tagged releases)
      - name: Create Release and Upload
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the tag name
          TAG_NAME=${{ github.ref_name }}
          
          # Find the built plugin zip file
          PLUGIN_ZIP=$(find build/distributions -name "*.zip" | head -n 1)
          
          if [ -z "$PLUGIN_ZIP" ]; then
            echo "Error: No plugin ZIP file found"
            exit 1
          fi
          
          # Create release
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes \
            "$PLUGIN_ZIP"

      # Store artifact (for non-tagged builds)
      - name: Upload artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build
          path: build/distributions/*.zip